<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGON V3 - Security Intelligence OS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');

    :root {
      --bg: #0a0e1a;
      --bg-2: #0f1420;
      --bg-3: #1a1f2e;
      --panel: rgba(20, 28, 40, 0.88);
      --panel-strong: #1a2540;
      --cyan: #00f0ff;
      --cyan-dim: #0088aa;
      --cyan-glow: rgba(0, 240, 255, 0.3);
      --purple: #8040ff;
      --magenta: #ff1493;
      --yellow: #ffed4e;
      --text: #e8f0ff;
      --muted: #8fa3c0;
      --shadow-glow: 0 0 20px rgba(0, 240, 255, 0.15);
      --shadow-deep: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 50%, rgba(128, 64, 255, 0.15), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(0, 240, 255, 0.1), transparent 35%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      line-height: 1.6;
      backdrop-filter: blur(1px);
    }

    @keyframes glow-pulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.6)); }
    }

    @keyframes float-in {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scan-line {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes data-flow {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(135deg, rgba(15, 20, 32, 0.95), rgba(26, 37, 62, 0.85));
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: var(--shadow-glow), 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 24px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
      animation: data-flow 3s linear infinite;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 12px;
      border: 1.5px solid var(--cyan);
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(128, 64, 255, 0.1));
      color: var(--cyan);
      border-radius: 999px;
      letter-spacing: 2px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3.2vw, 3.2rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--cyan) 0%, #00ddff 50%, var(--purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow-pulse 3s ease-in-out infinite;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      margin-top: 14px;
      background: linear-gradient(135deg, var(--yellow), #ffd700);
      color: #0a0a0a;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 12px 30px rgba(255, 237, 78, 0.3), var(--shadow-glow);
      animation: float-in 0.8s ease-out;
    }

    .tabs {
      position: sticky;
      top: 110px;
      z-index: 15;
      background: linear-gradient(180deg, rgba(15, 20, 32, 0.92), rgba(15, 20, 32, 0.8));
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.12);
      box-shadow: inset 0 -1px 0 rgba(0, 240, 255, 0.1);
    }

    .tabs-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 240, 255, 0.3) rgba(20, 28, 40, 0.5);
    }

    .tab {
      flex: 0 0 auto;
      cursor: pointer;
      border: 1.5px solid rgba(0, 240, 255, 0.2);
      background: rgba(26, 37, 62, 0.5);
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 10px 15px;
      border-radius: 8px;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
      user-select: none;
      font-weight: 600;
      position: relative;
    }

    .tab::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .tab:hover {
      border-color: rgba(0, 240, 255, 0.5);
      background: rgba(0, 240, 255, 0.05);
      color: var(--cyan);
      box-shadow: var(--shadow-glow);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: var(--bg);
      border-color: transparent;
      font-weight: 800;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), var(--shadow-glow);
      transform: translateY(-2px);
    }

    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
      animation: float-in 0.8s ease-out 0.1s both;
    }

    .card {
      background: linear-gradient(135deg, rgba(26, 37, 62, 0.7), rgba(20, 28, 40, 0.8));
      border: 1.5px solid rgba(0, 240, 255, 0.2);
      border-radius: 20px;
      box-shadow: var(--shadow-glow), var(--shadow-deep);
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 240, 255, 0.45);
      box-shadow: var(--shadow-glow), 0 24px 60px rgba(0, 240, 255, 0.15);
    }

    .card h3 {
      margin: 0 0 12px;
      color: var(--cyan);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.8;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .stat {
      border: 1.5px solid rgba(0, 240, 255, 0.2);
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.05), rgba(128, 64, 255, 0.05));
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, transparent, rgba(0, 240, 255, 0.1), transparent);
      animation: shimmer 3s infinite;
    }

    .stat:hover {
      border-color: rgba(0, 240, 255, 0.5);
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }

    .stat strong {
      display: block;
      font-size: 2rem;
      color: var(--cyan);
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
      font-weight: 800;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 20px;
      animation: float-in 0.8s ease-out 0.2s both;
    }

    .pillar-card {
      background: linear-gradient(135deg, rgba(26, 37, 62, 0.6), rgba(20, 28, 40, 0.7));
      border: 1.5px solid rgba(0, 240, 255, 0.15);
      border-radius: 18px;
      padding: 20px;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .pillar-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .pillar-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(0, 240, 255, 0.5);
      box-shadow: var(--shadow-glow), 0 16px 40px rgba(0, 240, 255, 0.1);
    }

    .pillar-card:hover::before {
      opacity: 1;
    }

    .pillar-card h4 {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .pillar-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 11px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(128, 64, 255, 0.1));
      border-radius: 999px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--cyan);
      font-size: 0.65rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .pill:hover {
      border-color: rgba(0, 240, 255, 0.6);
      box-shadow: var(--shadow-glow);
    }

    .chat-wrapper {
      margin-top: 24px;
      display: grid;
      gap: 14px;
      animation: float-in 0.8s ease-out 0.3s both;
    }

    .chat-box {
      height: 500px;
      overflow-y: auto;
      background: linear-gradient(135deg, rgba(15, 20, 32, 0.8), rgba(20, 28, 40, 0.9));
      border: 1.5px solid rgba(0, 240, 255, 0.2);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow-glow), inset 0 0 30px rgba(0, 240, 255, 0.05);
      position: relative;
    }

    .chat-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
      border-radius: 18px 18px 0 0;
    }

    .msg {
      max-width: 85%;
      margin: 10px 0;
      padding: 13px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.7;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      animation: float-in 0.4s ease-out;
      word-wrap: break-word;
    }

    .msg.user {
      margin-left: auto;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: var(--bg);
      border-bottom-right-radius: 4px;
      text-align: right;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 240, 255, 0.25);
    }

    .msg.bot {
      margin-right: auto;
      background: linear-gradient(135deg, rgba(26, 37, 62, 0.8), rgba(20, 28, 40, 0.9));
      color: var(--text);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-bottom-left-radius: 4px;
      position: relative;
    }

    .msg.bot::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.3), transparent);
      border-radius: 14px 14px 0 0;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-10px);
      }
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-row input {
      flex: 1;
      border-radius: 14px;
      border: 1.5px solid rgba(0, 240, 255, 0.25);
      background: linear-gradient(135deg, rgba(26, 37, 62, 0.5), rgba(20, 28, 40, 0.6));
      color: var(--text);
      padding: 14px 16px;
      font-size: 0.95rem;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-row input::placeholder {
      color: rgba(139, 157, 176, 0.6);
    }

    .input-row input:focus {
      border-color: rgba(0, 240, 255, 0.6);
      box-shadow: var(--shadow-glow), 0 0 0 3px rgba(0, 240, 255, 0.1);
      background: linear-gradient(135deg, rgba(26, 37, 62, 0.7), rgba(20, 28, 40, 0.8));
    }

    .input-row button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: var(--bg);
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.75rem;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
      box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3);
    }

    .input-row button:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 35px rgba(0, 240, 255, 0.4);
      filter: brightness(1.1);
    }

    .input-row button:active {
      transform: translateY(-1px);
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .quick {
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.08), rgba(128, 64, 255, 0.08));
      color: var(--cyan);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .quick:hover {
      border-color: rgba(0, 240, 255, 0.7);
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(128, 64, 255, 0.15));
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }

    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tabs-inner {
        padding: 10px 20px;
      }

      .msg {
        max-width: 92%;
      }

      h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 640px) {
      .content {
        padding: 20px 16px 50px;
      }

      .card {
        padding: 18px;
      }

      .chat-box {
        height: 380px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .board {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="eyebrow">🔐 Security Intelligence OS</div>
      <h1>AEGON V3</h1>
      <p class="subtitle">Unified Threat Response Platform</p>
      <div class="badge">12 Pillars Active</div>
    </div>
  </header>

  <nav class="tabs" aria-label="AEGON V3 Navigation">
    <div class="tabs-inner" id="tabs"></div>
  </nav>

  <main class="content" id="main"></main>

  <script>
    const pillars = {
      CHAT: { type: "chat" },
      "1 SIGNAL": {
        type: "pillars",
        items: [
          { title: "Signal vs Noise", desc: "Clean the signal by separating real threats from simulations, noise, and weak alerts. AI-driven enrichment." },
          { title: "Context Layer", desc: "Map entities, activity, and patterns into a decision-ready operating picture. Real-time correlation." },
          { title: "Adversary Lens", desc: "Assess risk through the mindset of actors, motives, and attack paths. Behavior modeling." }
        ],
        tags: ["Threat Detection", "Filtering", "Confidence"]
      },
      "2 REAL-TIME": {
        type: "pillars",
        items: [
          { title: "Live Delivery", desc: "Push critical insights to teams in seconds, not after the window has closed. Streaming architecture." },
          { title: "Unified Events", desc: "Correlate fragmented telemetry into one coherent story. Single source of truth." },
          { title: "Time-to-Action", desc: "Reduce response latency and compress decision windows. Sub-second integration." }
        ],
        tags: ["Speed", "Ops", "Response"]
      },
      "3 RISK": {
        type: "pillars",
        items: [

          { title: "Exposure Mapping", desc: "Measure where vulnerability, activity, and sensitivity intersect. CVSS + context." }
        ],
        tags: ["Priority", "Coverage", "Exposure"]
      },
      "4 ALERT": {
        type: "pillars",
        items: [
          { title: "Alert Quality", desc: "Eliminate low-value alert churn with sharper logic and stronger enrichment. 90% noise reduction." },
          { title: "False Positive Control", desc: "Suppress noise while preserving high-confidence indicators. Precision tuning." },
          { title: "Escalation Rules", desc: "Route only actionable alerts to the right responders and channels. Smart routing." }
        ],
        tags: ["Automation", "Triage", "Routing"]
      },
      "5 INTEL": {
        type: "pillars",
        items: [
          { title: "Threat Intel", desc: "Blend indicators, intent, and patterns into a usable intelligence layer. TIP integration." },
          { title: "Pattern Recognition", desc: "Identify recurring behaviors across campaigns, infrastructure, and actors. TTPs." },
          { title: "Awareness", desc: "Keep teams aligned around nearby threats, movement, and blast radius. Live feeds." }
        ],
        tags: ["Intel", "Patterns", "Awareness"]
      },
      "6 FORENSICS": {
        type: "pillars",
        items: [

      "7 ORCHESTRATION": {

        items: [

          { title: "Playbooks", desc: "Standardize response paths for recurring risk categories. Runbook automation." },
          { title: "Cross-Team Sync", desc: "Keep security, ops, and leadership aligned. Shared context." }
        ],
        tags: ["Playbooks", "Response", "Ops"]
      },
      "8 RESILIENCE": {
        type: "pillars",
        items: [
          { title: "Recovery Readiness", desc: "Prepare for disruption with resilient workflows and action paths. Continuity plans." },
          { title: "Continuity Signals", desc: "Track operational health, dependencies, and failure modes. Live health." },
          { title: "Degradation Alerts", desc: "Spot when risk is shifting before it becomes an outage. Early warning." }
        ],
        tags: ["Recovery", "Continuity", "Health"]
      },
      "9 GOVERNANCE": {
        type: "pillars",
        items: [
          { title: "Policy Alignment", desc: "Ensure actions align to governance and control expectations. Compliance first." },
          { title: "Compliance Signals", desc: "Convert regulatory requirements into operational checks. Automated controls." },
          { title: "Accountability", desc: "Maintain accountability across approvals and actions. Full audit trail." }
        ],
        tags: ["Governance", "Policy", "Compliance"]
      },
      "10 REPORTING": {
        type: "pillars",
        items: [
          { title: "Executive Reporting", desc: "Turn operational detail into concise leadership insight. Exec dashboards." },
          { title: "Analyst Briefs", desc: "Surface lessons, trends, and risk narratives. Daily reporting." },
          { title: "Performance View", desc: "Measure system effectiveness and response maturity. KPIs." }
        ],
        tags: ["Narrative", "Metrics", "Briefs"]
      },
      "11 AI": {
        type: "pillars",
        items: [
          { title: "Assistive Intelligence", desc: "Use AI to summarize, prioritize, and contextualize workflows. Smart assist." },
          { title: "Human-in-the-Loop", desc: "Keep operators in control by validating recommendations. Explainable AI." },
          { title: "Adaptive Learning", desc: "Continuously improve with feedback from analysts and outcomes. Self-tuning." }
        ],
        tags: ["AI", "Assist", "Learning"]
      },
      "12 COMMAND": {
        type: "pillars",
        items: [
          { title: "Command View", desc: "Provide a central lens for awareness, direction, and control. War room ready." },
          { title: "Decision Support", desc: "Give leaders clear view of priorities, dependencies, and consequences. Decision ready." },
          { title: "Confidence", desc: "Stabilize decisions through visibility, structure, and shared context. Trust." }
        ],
        tags: ["Command", "Decision", "Control"]
      }
    };

    const tabNames = Object.keys(pillars);
    let active = "CHAT";

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = tabNames.map((tab) => `
        <div class="tab ${tab === active ? "active" : ""}" onclick="switchTab('${tab}')">${tab}</div>
      `).join("");
    }

    function switchTab(tab) {
      active = tab;
      renderTabs();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderMain() {
      const main = document.getElementById("main");
      const data = pillars[active];

      if (!data) return;

      if (active === "CHAT") {
        main.innerHTML = `
          <section class="hero">
            <div class="card">
              <h3>🤖 Advanced AI Assistant</h3>
              <p>Ask about any pillar, signal flow, risk assessment, or operational workflow. This AI is trained on AEGON's entire threat intelligence framework and can explain complex concepts in operator terms.</p>
              <div class="stats">
                <div class="stat">
                  <strong>12</strong>
                  <span>Pillars</span>
                </div>
                <div class="stat">
                  <strong>360°</strong>
                  <span>Context</span>
                </div>
                <div class="stat">
                  <strong>&lt;1s</strong>
                  <span>Response</span>
                </div>
              </div>
            </div>
            <div class="card">
              <h3>💡 Suggested Questions</h3>
              <div class="quick-actions">
                <div class="quick" onclick="ask('Explain signal vs noise')">Signal vs noise</div>
                <div class="quick" onclick="ask('How does alert fatigue get reduced?')">Alert fatigue</div>
                <div class="quick" onclick="ask('What is risk prioritization?')">Risk prioritization</div>
                <div class="quick" onclick="ask('Explain the command view')">Command view</div>
                <div class="quick" onclick="ask('How does AI assist in AEGON?')">AI assistance</div>
                <div class="quick" onclick="ask('What is the threat intelligence layer?')">Threat intel</div>
              </div>
            </div>
          </section>
          <section class="chat-wrapper">
            <div class="chat-box" id="chat">
              <div class="msg bot">Welcome to AEGON V3 Command Center. I'm your AI guide to the 12-pillar security intelligence architecture. Ask me about threat detection, response workflows, governance, or any aspect of unified threat response. How can I assist you today?</div>
            </div>
            <div class="input-row">
              <input id="q" type="text" placeholder="What would you like to know about AEGON V3?" aria-label="Chat with AEGON V3" onkeypress="if(event.key==='Enter') send()" />
              <button onclick="send()">→</button>
            </div>
          </section>
        `;
        return;
      }

      main.innerHTML = `
        <section class="card">
          <h3>📊 ${active}</h3>
          <p>${data.tags ? data.tags.map(tag => `<span class="pill">${tag}</span>`).join(" ") : ""}</p>
        </section>
        <section class="board">
          ${data.items.map(item => `
            <article class="pillar-card">
              <h4>${item.title}</h4>
              <p>${item.desc}</p>
            </article>
          `).join("")}
        </section>
      `;
    }

    function ask(prompt) {
      const input = document.getElementById("q");
      if (input) {
        input.value = prompt;
        setTimeout(() => send(), 100);
      }
    }

    function send() {
      const input = document.getElementById("q");
      const chat = document.getElementById("chat");
      if (!input || !chat) return;

      const q = input.value.trim();
      if (!q) return;

      chat.innerHTML += `<div class="msg user">${escapeHtml(q)}</div>`;

      // Show typing indicator
      const typingId = "typing-" + Date.now();
      chat.innerHTML += `<div class="msg bot" id="${typingId}"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
      chat.scrollTop = chat.scrollHeight;

      const lower = q.toLowerCase();
      let answer = "AEGON is a unified threat response platform built on 12 pillars. Each pillar is a domain of security intelligence—from signal filtering to command decision-making. Ask about any specific pillar or concept and I'll explain how it works in practice.";

      if (lower.includes("signal") || lower.includes("noise")) {
        answer = "Signal vs noise is Pillar 1: the foundation. Real threats are distinguished from background chatter, false positives, and simulation. AEGON filters using AI enrichment, entity correlation, and confidence scoring. The goal: reduce noise by 90% while keeping high-confidence signals intact.";
      } else if (lower.includes("alert") || lower.includes("fatigue")) {
        answer = "Alert fatigue is solved through Pillar 4: Alert Quality. Three key mechanisms: (1) eliminate low-value alerts with sharper detection logic, (2) suppress false positives while preserving true signals, (3) route only actionable alerts to the right responders. Result: fewer alerts, higher action rate.";
      } else if (lower.includes("risk") || lower.includes("priorit")) {
        answer = "Pillar 3: Risk Prioritization. AEGON ranks events by impact, urgency, and confidence. This translates technical signals into business risk language, maps where vulnerability meets activity, and surfaces the highest-consequence threats first. Teams focus resources where it matters most.";
      } else if (lower.includes("real") || lower.includes("time")) {
        answer = "Pillar 2: Real-Time Delivery. Intelligence flows in seconds via streaming architecture. Fragmented telemetry is unified into one coherent story. Response windows shrink dramatically. Operators get decision-ready insight while the threat is still active, not in post-mortems.";
      } else if (lower.includes("governance") || lower.includes("policy") || lower.includes("compliance")) {
        answer = "Pillar 9: Governance. AEGON ensures all actions align to policy, controls, and regulatory expectations. Compliance rules are converted into automated checks. Every decision is auditable. This bridges the gap between security operations and compliance/audit requirements.";
      } else if (lower.includes("ai") || lower.includes("assistant") || lower.includes("intelligence")) {
        answer = "Pillar 11: AI. AEGON uses assistive intelligence to summarize large datasets, prioritize events, and contextualize workflows. Critical: human-in-the-loop keeps operators in control. The AI explains its reasoning (explainable), learns from feedback, and continuously improves. Trust through transparency.";
      } else if (lower.includes("command") || lower.includes("leader") || lower.includes("executive")) {
        answer = "Pillar 12: Command View. This is the unified lens for awareness, direction, and operational control. Leaders see priorities, dependencies, and consequences at a glance. Decision support tools translate technical risk into strategic language. War room ready.";
      } else if (lower.includes("forensics") || lower.includes("investigation") || lower.includes("timeline")) {
        answer = "Pillar 6: Forensics. Root cause analysis through event chain reconstruction. Evidence is organized into a reviewable timeline with full traceability. Every decision is auditable. This supports investigations, compliance reviews, and post-incident learning.";
      } else if (lower.includes("orchestration") || lower.includes("playbook") || lower.includes("workflow")) {
        answer = "Pillar 7: Orchestration. This connects intelligence, automated actions, and human decisions in one platform. Standardized playbooks automate recurring response patterns. Cross-team sync keeps everyone aligned with shared context and single source of truth.";
      } else if (lower.includes("threat") || lower.includes("intel")) {
        answer = "Pillar 5: Intelligence. AEGON blends threat indicators, adversary intent, and behavioral patterns into a usable intelligence layer. TIP integration brings external intelligence. Pattern recognition identifies recurring TTPs. Situational awareness keeps teams focused on active, nearby threats.";
      } else if (lower.includes("resilience") || lower.includes("recovery") || lower.includes("continuity")) {
        answer = "Pillar 8: Resilience. Prepare for disruption with recovery readiness planning. AEGON continuously tracks operational health, dependencies, and failure modes. Degradation alerts surface emerging risks before they become outages. Resilient workflows ensure continuity under pressure.";
      } else if (lower.includes("reporting") || lower.includes("metrics") || lower.includes("kpi")) {
        answer = "Pillar 10: Reporting. Executive reporting distills operational detail into concise leadership insight. Analyst briefs surface trends and risk narratives. KPI dashboards measure system effectiveness and response maturity. Data-driven accountability at every level.";
      }

      // Simulate typing delay, then replace
      setTimeout(() => {
        const typingEl = document.getElementById(typingId);
        if (typingEl) {
          typingEl.innerHTML = answer;
        }
        chat.scrollTop = chat.scrollHeight;
      }, 800 + Math.random() * 600);

      input.value = "";
    }

    renderTabs();
    renderMain();
  </script>
</body>
</html>
